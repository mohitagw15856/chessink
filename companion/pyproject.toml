[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessink-companion"
version = "0.1.0"
description = "Builds .pzl puzzle packs for the ChessInk app"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
chessink = "chessink.cli:main"

[tool.setuptools.packages.find]
include = ["chessink*"]
